name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔄 Checking if repository directory exists..."
            if [ ! -d "/home/ubuntu/ci-cd-project" ]; then
              echo "📥 Directory not found. Cloning repository..."
              git clone https://github.com/shveshkottary77-dot/bug-tracker.git /home/ubuntu/ci-cd-project
            else
              echo "🔄 Directory exists. Fetching latest changes..."
              cd /home/ubuntu/ci-cd-project
              git fetch origin main
              git reset --hard origin/main
            fi

            cd /home/ubuntu/ci-cd-project

            echo "🐳 Building Docker image locally on EC2..."
            docker build -t bug-tracker:latest .

            echo "🛑 Stopping old container if running..."
            docker stop bug-tracker || true
            docker rm bug-tracker || true

            echo "🚀 Launching new container with persistent database mount..."
            mkdir -p /home/ubuntu/bugtracker_db
            docker run -d \
              --name bug-tracker \
              --restart always \
              -p 5000:5000 \
              -v /home/ubuntu/bugtracker_db:/app/instance \
              bug-tracker:latest

            echo "✅ Deployment successful!"
