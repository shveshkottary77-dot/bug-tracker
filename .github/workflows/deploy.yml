name: Deploy to AWS EC2 via Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Step 1: Checkout repository code
      # ─────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v3

      # ─────────────────────────────────────────────
      # Step 2: Log in to Docker Hub
      # ─────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ─────────────────────────────────────────────
      # Step 3: Build and Push Docker image
      # ─────────────────────────────────────────────
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bug-tracker:latest

      # ─────────────────────────────────────────────
      # Step 4: SSH into EC2 and run the container
      # ─────────────────────────────────────────────
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest Docker image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/bug-tracker:latest

            # Stop and remove the old container (if running)
            docker stop bug-tracker || true
            docker rm bug-tracker || true

            # Run the new container
            docker run -d \
              --name bug-tracker \
              --restart always \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/bug-tracker:latest

            echo "✅ Docker deployment successful!"
